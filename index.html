<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thử Tài Văn Học - Roboki AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;900&family=Merriweather:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Be Vietnam Pro', sans-serif;
      }
      h1, h2, h3, .serif-font {
        font-family: 'Merriweather', serif;
      }
      /* Custom scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #f1f1f1;
      }
      ::-webkit-scrollbar-thumb {
        background: #94a3b8;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #64748b;
      }
      
      /* Vintage Paper / Watercolor Background */
      .bg-container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: -1;
        background-color: #fdfbf7;
        /* Paper texture pattern */
        background-image: url("https://www.transparenttextures.com/patterns/cream-paper.png");
        overflow: hidden;
      }

      /* Watercolor washes */
      .wash {
        position: absolute;
        filter: blur(80px);
        opacity: 0.4;
        border-radius: 50%;
        animation: float 20s infinite ease-in-out alternate;
      }

      .wash-1 {
        top: -10%;
        left: -10%;
        width: 70vw;
        height: 70vw;
        background: radial-gradient(circle, #e0f2fe, #fdfbf7);
        animation-duration: 25s;
      }

      .wash-2 {
        bottom: -20%;
        right: -10%;
        width: 60vw;
        height: 60vw;
        background: radial-gradient(circle, #fae8ff, #fdfbf7);
        animation-duration: 30s;
        animation-direction: alternate-reverse;
      }

      .wash-3 {
        top: 40%;
        left: 30%;
        width: 50vw;
        height: 50vw;
        background: radial-gradient(circle, #fff7ed, #fdfbf7);
        animation-duration: 35s;
      }

      @keyframes float {
        0% { transform: translate(0, 0) rotate(0deg); }
        100% { transform: translate(30px, 20px) rotate(5deg); }
      }

      /* Glassmorphism utility */
      .glass-panel {
        background: rgba(255, 255, 255, 0.65);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.6);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "canvas-confetti": "https://aistudiocdn.com/canvas-confetti@^1.9.4",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/"
  }
}
</script>
</head>
  <body class="h-screen w-screen overflow-hidden text-slate-800 antialiased selection:bg-amber-200 selection:text-amber-900">
    <div class="bg-container">
      <div class="wash wash-1"></div>
      <div class="wash wash-2"></div>
      <div class="wash wash-3"></div>
    </div>
    <div id="root" class="h-full w-full relative z-10"></div>
  </body>
</html>
