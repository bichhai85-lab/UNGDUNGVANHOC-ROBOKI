          const wrongMainAudio = React.useRef(new Audio(SOUNDS.WRONG));

          const bgmRef = React.useRef(new Audio(SOUNDS.BGM_EPIC));

          const playSound = (correct) => {
            if (isMuted) return;
            if (correct) {
               correctMainAudio.current.currentTime = 0; correctMainAudio.current.volume = 1.0 * volumeSettings.correct; correctMainAudio.current.play().catch(()=>{});

               wrongMainAudio.current.currentTime = 0; wrongMainAudio.current.volume = 1.0 * volumeSettings.wrong; wrongMainAudio.current.play().catch(()=>{});

          };

          const triggerFlowerEffect = () => {
             const colors = ['#ff6b6b', '#ff9ff3', '#feca57', '#ff4757', '#2ed573'];
             window.confetti({ particleCount: 50, spread: 70, origin: { y: 0.6 }, colors: colors });

            if (isAnswered) return;

          };

          const theme = (() => {
             if (level === LevelType.LEVEL_3) return { border: "border-purple-200", badge: "bg-purple-100 text-purple-700", gradient: "from-purple-500 to-fuchsia-600", nextBtn: "bg-gradient-to-r from-fuchsia-500 to-purple-500" };
             if (level === LevelType.SPECIAL) return { border: "border-yellow-400", badge: "bg-red-600 text-white", gradient: "from-yellow-500 via-orange-500 to-red-600", nextBtn: "bg-gradient-to-r from-yellow-500 to-red-600" };
             if (level === LevelType.GRADUATION) return { border: "border-cyan-200", badge: "bg-blue-600 text-white", gradient: "from-blue-600 to-teal-500", nextBtn: "bg-gradient-to-r from-blue-600 to-teal-600" };
             return { border: "border-blue-100", badge: "bg-blue-50 text-blue-600", gradient: "from-blue-500 to-indigo-600", nextBtn: "bg-gradient-to-r from-cyan-500 to-blue-500" };
          })();

          if (!currentQuestion) return <div>Đang tải...</div>;

          return (
            <div className="w-full max-w-4xl mx-auto flex flex-col gap-1 md:gap-5 animate-fade-in relative pb-16 md:pb-0">
               <div className={`glass-panel px-2 py-1 md:p-4 rounded-lg shadow-sm border ${theme.border} flex justify-between items-center gap-2 relative z-50`}>
                  <div className="flex-1">
                      <div className="flex justify-between items-end mb-1">
                          <span className="font-black uppercase text-[10px] md:text-sm">{level.replace(/_/g, ' ')}</span>
                          <span className={`text-[9px] font-bold px-1.5 py-0.5 rounded-full ${theme.badge}`}>{questionIndex + 1}/{questions.length}</span>
                      </div>
                      <div className="h-1.5 w-full rounded-full bg-slate-200"><div className="h-full rounded-full bg-blue-500 transition-all duration-700" style={{ width: `${((questionIndex + 1) / questions.length) * 100}%` }}></div></div>
                  </div>
                  <button onClick={() => setShowVolumeControls(!showVolumeControls)} className="p-1 rounded bg-white/50">🔊</button>
                  {showVolumeControls && (
                      <div className="absolute top-full right-0 mt-2 w-48 bg-white p-4 rounded shadow-xl border z-50">
                          <label className="block text-xs font-bold mb-1">Đúng</label><input type="range" min="0" max="1" step="0.1" value={volumeSettings.correct} onChange={e=>onUpdateVolume({...volumeSettings, correct: parseFloat(e.target.value)})} className="w-full" />
                          <label className="block text-xs font-bold mt-2 mb-1">Sai</label><input type="range" min="0" max="1" step="0.1" value={volumeSettings.wrong} onChange={e=>onUpdateVolume({...volumeSettings, wrong: parseFloat(e.target.value)})} className="w-full" />
                      </div>
                  )}
               </div>

               <div className={`bg-white rounded-lg p-2 md:p-10 border-b-2 md:border-b-4 ${theme.border} shadow-sm min-h-[70px] md:min-h-[220px] flex items-center justify-center relative overflow-hidden`}>
                  <div className={`absolute top-0 left-0 w-full h-1 bg-gradient-to-r ${theme.gradient}`}></div>
                  <h2 className="text-sm md:text-3xl font-bold text-slate-800 text-center leading-snug z-10 serif-font w-full max-h-[100px] md:max-h-none overflow-y-auto">{currentQuestion.content}</h2>
               </div>

               <div className="grid grid-cols-1 md:grid-cols-2 gap-1.5 md:gap-5">
                  {currentQuestion.options.map((option, index) => {
                     let btnClass = "relative px-2 py-2 md:p-6 rounded-lg text-[11px] md:text-lg font-medium transition-all shadow-sm min-h-[40px] md:min-h-[100px] border ";
                     if (isAnswered) {
                        if (index === currentQuestion.correctIndex) btnClass += "bg-green-50 border-green-500 text-green-800";
                        else if (index === selectedOption) btnClass += "bg-red-50 border-red-500 text-red-800 opacity-90";
                        else btnClass += "bg-slate-50 border-slate-200 text-slate-400 opacity-50";
                     } else {
                        btnClass += "bg-white border-blue-100 hover:scale-[1.02] hover:shadow-lg cursor-pointer";
                     }
                     return (
                       <button key={index} onClick={() => handleOptionClick(index)} disabled={isAnswered} className={btnClass}>
                         <span className="relative z-10">{option}</span>
                         <span className="absolute top-1 left-1.5 text-[8px] bg-slate-100 text-slate-500 px-1 rounded">{String.fromCharCode(65 + index)}</span>
                       </button>
                     );
                  })}
               </div>

               {isAnswered && (
                 <div ref={feedbackRef} className={`fixed bottom-0 left-0 right-0 md:static md:mt-2 z-[60] animate-slide-up shadow-2xl md:shadow-xl border-t-4 md:border-none md:rounded-3xl ${isCorrect ? 'bg-green-600' : 'bg-red-600'}`}>
                    <div className="bg-white/95 backdrop-blur-xl md:rounded-[1.3rem] p-3 md:p-8">
                       <h3 className={`font-black uppercase mb-2 ${isCorrect ? 'text-green-700' : 'text-red-700'}`}>{isCorrect ? 'Chính xác! 🌸' : 'Sai rồi! 🤡'}</h3>
                       <div className="bg-slate-50 p-3 rounded-xl border border-slate-200 mb-3">
                          <p className="text-slate-800 text-sm md:text-lg font-medium">{currentQuestion.explanation}</p>
                          {currentQuestion.citation && (
                             <div className="mt-2 pt-2 border-t border-dashed border-slate-200 text-sm italic text-slate-600">📖 Nguồn: {currentQuestion.citation}</div>
                          )}
                       </div>
                       <button onClick={onNext} className={`w-full py-3 ${theme.nextBtn} text-white font-bold rounded-xl shadow-lg hover:scale-105 transition-transform`}>KẾ TIẾP</button>
                    </div>
                 </div>
               )}
            </div>
          );
        };

        const LevelIntroScreen = ({ level, onStart }) => {
            const info = LEVEL_INFO[level];
            const generateOfflineHTML = () => {
                 const htmlContent = `<!DOCTYPE html><html><body><h1>Bài tập Offline - ${info.title}</h1></body></html>`; // Simplified for brevity
                 const blob = new Blob([htmlContent], { type: "text/html" });
                 const url = URL.createObjectURL(blob);
                 const a = document.createElement("a"); a.href = url; a.download = `bai_tap_${level}.html`; a.click();
            };
            return (
                <div className="w-full max-w-lg mx-auto p-8 rounded-[2rem] shadow-2xl bg-white border-4 border-blue-200 text-center animate-scale-in">
                    <div className="text-6xl mb-4">{info.icon}</div>
                    <h2 className="text-2xl font-black uppercase mb-2">{info.title}</h2>
                    <p className="text-slate-600 mb-6">{info.desc}</p>
                    <div className="flex flex-col gap-3">
                        <button onClick={onStart} className="w-full py-4 bg-blue-600 text-white font-bold rounded-2xl shadow-lg hover:scale-105 transition-transform">BẮT ĐẦU</button>
                        <button onClick={generateOfflineHTML} className="w-full py-3 bg-slate-100 text-slate-600 font-bold rounded-xl hover:bg-slate-200">Tải đề Offline (HTML)</button>
                    </div>
                </div>
            );
        };

        const RoadmapScreen = ({ user, xp, completionCount, onContinue }) => {
          const isSpecialUnlocked = completionCount >= 9;
          return (
             <div className="w-full max-w-4xl mx-auto flex flex-col h-full pb-12">
                 <div className="text-center mb-6">
                    <h2 className="text-2xl font-black uppercase">Lộ Trình</h2>
                    <p className="text-slate-600">Chào, <span className="text-blue-700 font-bold">{user.name}</span>! <span className="bg-amber-100 px-2 rounded-full text-amber-800 font-bold ml-2">★ {xp} XP</span></p>
                 </div>
                 <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                     {[LevelType.LEVEL_1, LevelType.LEVEL_2, LevelType.LEVEL_3].map((lvl, i) => (
                         <div key={lvl} onClick={onContinue} className={`p-4 rounded-xl border-2 cursor-pointer hover:scale-105 transition-transform ${i===0?'bg-white border-blue-400 shadow-lg':'bg-slate-50 border-slate-200 opacity-80'}`}>
                             <div className="text-3xl mb-2">{LEVEL_INFO[lvl].icon}</div>
                             <h3 className="font-bold">{LEVEL_INFO[lvl].title}</h3>
                         </div>
                     ))}
                 </div>
                 <div className="mt-8 text-center">
                    <button onClick={onContinue} className="px-10 py-4 bg-blue-600 text-white font-bold text-xl rounded-full shadow-xl hover:scale-105 transition-transform">TIẾP TỤC</button>
                 </div>
             </div>
          );
        };
        
        const LevelResultScreen = ({ score, total, level, onNextStage, onRetry, isMuted }) => {
            const isPass = score === total;
            React.useEffect(() => {
                if (isPass && !isMuted) { new Audio(SOUNDS.VICTORY_LEVEL).play().catch(()=>{}); }
            }, [isPass, isMuted]);
            return (
                <div className="glass-panel rounded-[2rem] shadow-2xl p-8 max-w-lg w-full text-center mx-auto border border-white/60 animate-scale-in">
                    <div className="text-8xl mb-4 animate-bounce">{isPass ? '🏆' : '💪'}</div>
                    <h2 className="text-3xl font-black uppercase mb-2">{isPass ? 'HOÀN THÀNH!' : 'CỐ GẮNG LÊN!'}</h2>
                    <p className="text-lg mb-6">Kết quả: <span className="font-bold text-2xl">{score}/{total}</span></p>
                    {isPass ? 
                        <button onClick={onNextStage} className="w-full py-4 bg-green-600 text-white font-bold rounded-2xl shadow-lg">TIẾP TỤC</button> 
                        : 
                        <button onClick={onRetry} className="w-full py-4 bg-slate-700 text-white font-bold rounded-2xl shadow-lg">LÀM LẠI BÀI TẬP</button>
                    }
                </div>
            );
        };

        const CertificateScreen = ({ user, rank, xp, currentLevel, completionCount, onStartSpecial, onRestart, isMuted }) => {
            React.useEffect(() => {
                if (!isMuted) new Audio(SOUNDS.CERTIFICATE_SOUND).play().catch(()=>{});
                window.confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, colors: ['#FFD700', '#F0E68C'] });
            }, []);
            
            let certTitle = "CUỘC THI SÁNG TẠO SẢN PHẨM GIÁO DỤC TRÊN NỀN TẢNG ROBOKI";
            if (completionCount >= 9) certTitle = "HUY CHƯƠNG KIM CƯƠNG";
            else if (completionCount >= 6) certTitle = "NHÀ VÔ ĐỊCH HỌC TẬP";
            else if (completionCount >= 3) certTitle = "CHUỖI CHIẾN THẮNG";
            else if (completionCount >= 1) certTitle = "CHIẾN THẮNG ĐẦU TIÊN";

            return (
                <div className="max-w-2xl w-full mx-auto animate-fade-in flex flex-col gap-6 pb-20">
                    <div className="relative bg-[#fffdf5] rounded-xl shadow-2xl p-2 border-8 border-double border-[#b48d52] overflow-hidden text-center">
                        <div className="absolute top-5 right-5 z-20 flex flex-col items-center">
                            <img src={ROBOKI_LOGO_URL} alt="Roboki" className="w-12 h-12 rounded-full border-2 border-[#b48d52]" />
                            <span className="text-[10px] font-black text-[#b48d52]">ROBOKI AI</span>
                        </div>
                        <div className="p-8">
                            <h1 className="text-3xl font-black text-[#85603f] uppercase mb-1">THỬ TÀI VĂN HỌC</h1>
                            <p className="text-[#85603f] italic mb-6">Trân trọng trao tặng danh hiệu</p>
                            <h2 className="text-4xl font-black text-[#d32f2f] mb-2 font-serif">{user.name}</h2>
                            <p className="font-bold text-slate-700 mb-6">{user.className} - {user.school}</p>
                            <div className="w-full h-px bg-[#b48d52] mb-4"></div>
                            <h3 className="text-2xl font-black text-[#1e3a8a] uppercase mb-6">{certTitle}</h3>
                            <div className="flex justify-center gap-4 mb-8">
                                <div className="bg-yellow-100 border border-yellow-400 px-4 py-2 rounded-xl"><span className="block text-xs uppercase font-bold text-yellow-800">Xếp loại</span><span className="text-xl font-black text-red-700">{rank}</span></div>
                                <div className="bg-blue-100 border border-blue-400 px-4 py-2 rounded-xl"><span className="block text-xs uppercase font-bold text-blue-800">XP</span><span className="text-xl font-black text-blue-900">{xp}</span></div>
                            </div>
                            <div className="flex justify-between items-end text-xs text-[#85603f] mt-4">
                                <div className="flex flex-col items-center"><img src="https://github.com/bichhai85-lab/Logo/blob/main/logo%20tro%20choi.jpg?raw=true" className="w-12 h-12 rounded-full border border-[#b48d52] mb-1"/><span className="uppercase font-bold">Xác nhận tự động</span></div>
                                <div className="text-right"><span>An Giang, {new Date().toLocaleDateString('vi-VN')}</span><div className="font-bold uppercase mt-1">Đặng Thị Bích Hài</div><div>Giáo viên phụ trách</div></div>
                            </div>
                        </div>
                    </div>
                    {rank === CertificateRank.DAT && (
                        <div className="bg-white/80 p-4 rounded-xl text-center shadow-sm">
                             <p className="text-orange-600 font-bold mb-3">Hoàn thành thêm để nâng hạng & tích XP!</p>
                             <button onClick={onRestart} className="w-full py-3 bg-gradient-to-r from-blue-600 to-cyan-600 text-white font-bold rounded-xl shadow-lg uppercase">Làm lại để nâng hạng & Tích điểm</button>
                        </div>
                    )}
                     {rank === CertificateRank.XUAT_SAC && (
                        <button onClick={onStartSpecial} className="w-full py-4 bg-gradient-to-r from-rose-500 to-pink-600 text-white font-bold rounded-xl shadow-lg uppercase">BƯỚC VÀO THỬ THÁCH ĐẶC BIỆT</button>
                    )}
                </div>
            );
        };

        const App = () => {
          const [gameState, setGameState] = React.useState({ screen: 'INTRO', currentLevel: LevelType.LEVEL_1, questions: [], currentQuestionIndex: 0, score: 0, user: { name: '', className: '', school: '' }, xp: 0 });
          const [completionCount, setCompletionCount] = React.useState(0);
          const [isMuted, setIsMuted] = React.useState(false);
          const [volumeSettings, setVolumeSettings] = React.useState({ correct: 1.0, wrong: 1.0 });

          React.useEffect(() => {
            const saved = localStorage.getItem('roboki_completion_count');
            if (saved) setCompletionCount(parseInt(saved, 10));
          }, []);

          const loadLevel = async (level) => {
            setGameState(p => ({ ...p, screen: 'LOADING', currentLevel: level, currentQuestionIndex: 0, score: 0, questions: [] }));
            const questions = await fetchQuestions(level);
            setGameState(p => ({ ...p, questions, screen: 'LEVEL_INTRO' }));
          };

          const nextStage = () => {
            const { currentLevel } = gameState;
            if (currentLevel === LevelType.LEVEL_1) loadLevel(LevelType.LEVEL_2);
            else if (currentLevel === LevelType.LEVEL_2) loadLevel(LevelType.LEVEL_3);
            else if (currentLevel === LevelType.LEVEL_3) {
              const newCount = completionCount + 1;
              setCompletionCount(newCount);
              localStorage.setItem('roboki_completion_count', newCount.toString());
              setGameState(p => ({ ...p, screen: 'CERTIFICATE' }));
            } else if (currentLevel === LevelType.SPECIAL) loadLevel(LevelType.GRADUATION);
            else if (currentLevel === LevelType.GRADUATION) setGameState(p => ({ ...p, screen: 'CERTIFICATE' }));
          };

          const getRank = (count, level) => {
            if (level === LevelType.GRADUATION) return CertificateRank.THIEN_TAI;
            if (level === LevelType.SPECIAL) return CertificateRank.NHAN_TAI;
            if (count >= 9) return CertificateRank.XUAT_SAC;
            if (count >= 6) return CertificateRank.GIOI;
            if (count >= 3) return CertificateRank.KHA;
            return CertificateRank.DAT;
          };

          const rank = getRank(completionCount, gameState.currentLevel);

          return (
            <Layout isMuted={isMuted} onToggleMute={() => setIsMuted(!isMuted)} xp={gameState.xp} userName={gameState.user.name}>
              {gameState.screen === 'INTRO' && <IntroScreen onStart={u => setGameState(p => ({ ...p, user: u, screen: 'ROADMAP' }))} />}
              {gameState.screen === 'ROADMAP' && <RoadmapScreen user={gameState.user} xp={gameState.xp} completionCount={completionCount} onContinue={() => loadLevel(LevelType.LEVEL_1)} />}
              {gameState.screen === 'LOADING' && <div className="p-10 text-center animate-pulse font-bold text-blue-600">Đang tải dữ liệu...</div>}
              {gameState.screen === 'LEVEL_INTRO' && <LevelIntroScreen level={gameState.currentLevel} onStart={() => setGameState(p => ({ ...p, screen: 'PLAYING' }))} />}
              {gameState.screen === 'PLAYING' && <QuizScreen level={gameState.currentLevel} questions={gameState.questions} questionIndex={gameState.currentQuestionIndex} onAnswer={correct => { if(correct) setGameState(p => ({...p, score: p.score+1, xp: p.xp+10})); }} onNext={() => { if(gameState.currentQuestionIndex < gameState.questions.length - 1) setGameState(p => ({...p, currentQuestionIndex: p.currentQuestionIndex+1})); else setGameState(p => ({...p, screen: 'LEVEL_RESULT'})); }} isMuted={isMuted} volumeSettings={volumeSettings} onUpdateVolume={setVolumeSettings} />}
              {gameState.screen === 'LEVEL_RESULT' && <LevelResultScreen score={gameState.score} total={gameState.questions.length} level={gameState.currentLevel} onNextStage={nextStage} onRetry={() => loadLevel(gameState.currentLevel)} isMuted={isMuted} />}
              {gameState.screen === 'CERTIFICATE' && <CertificateScreen user={gameState.user} rank={rank} xp={gameState.xp} currentLevel={gameState.currentLevel} completionCount={completionCount} onStartSpecial={() => loadLevel(LevelType.SPECIAL)} onRestart={() => loadLevel(LevelType.LEVEL_1)} isMuted={isMuted} />}
            </Layout>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
